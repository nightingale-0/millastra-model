<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f2ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9d8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe9d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#7b6cf0"/>
      <stop offset="0.55" stop-color="#3d3a9e"/>
      <stop offset="1" stop-color="#1f1d55"/>
    </radialGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f63"/>
      <stop offset="1" stop-color="#151735"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8e9f2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- background: grey translucent elements (network nodes, chat bubbles, token squares, binary) -->
  <g fill="none" stroke="#8a8a84" stroke-opacity="0.18" stroke-width="2">
    <line x1="120" y1="160" x2="330" y2="260"/><line x1="330" y1="260" x2="520" y2="140"/>
    <line x1="330" y1="260" x2="400" y2="460"/><line x1="400" y1="460" x2="210" y2="560"/>
    <line x1="400" y1="460" x2="640" y2="520"/><line x1="520" y1="140" x2="760" y2="200"/>
    <line x1="1500" y1="880" x2="1700" y2="960"/><line x1="1700" y1="960" x2="1820" y2="820"/>
    <line x1="1500" y1="880" x2="1380" y2="1000"/><line x1="1820" y1="820" x2="1860" y2="640"/>
  </g>
  <g fill="#8a8a84" fill-opacity="0.18">
    <circle cx="120" cy="160" r="9"/><circle cx="330" cy="260" r="13"/><circle cx="520" cy="140" r="9"/>
    <circle cx="400" cy="460" r="11"/><circle cx="210" cy="560" r="8"/><circle cx="640" cy="520" r="9"/>
    <circle cx="760" cy="200" r="7"/><circle cx="1500" cy="880" r="11"/><circle cx="1700" cy="960" r="9"/>
    <circle cx="1820" cy="820" r="12"/><circle cx="1380" cy="1000" r="8"/><circle cx="1860" cy="640" r="7"/>
  </g>
  <!-- chat bubble outlines -->
  <g fill="none" stroke="#8a8a84" stroke-opacity="0.16" stroke-width="3">
    <path d="M1180 120 h300 a28 28 0 0 1 28 28 v70 a28 28 0 0 1 -28 28 h-250 l-34 28 v-28 h-16 a28 28 0 0 1 -28 -28 v-70 a28 28 0 0 1 28 -28 z"/>
    <path d="M1560 300 h220 a24 24 0 0 1 24 24 v52 a24 24 0 0 1 -24 24 h-14 v26 l-30 -26 h-176 a24 24 0 0 1 -24 -24 v-52 a24 24 0 0 1 24 -24 z"/>
    <path d="M90 760 h260 a26 26 0 0 1 26 26 v60 a26 26 0 0 1 -26 26 h-210 l-30 26 v-26 h-20 a26 26 0 0 1 -26 -26 v-60 a26 26 0 0 1 26 -26 z"/>
  </g>
  <g fill="#8a8a84" fill-opacity="0.14">
    <rect x="1210" y="160" width="160" height="12" rx="6"/><rect x="1210" y="190" width="230" height="12" rx="6"/>
    <rect x="1590" y="336" width="150" height="10" rx="5"/><rect x="1590" y="362" width="110" height="10" rx="5"/>
    <rect x="120" y="796" width="200" height="11" rx="5"/><rect x="120" y="822" width="140" height="11" rx="5"/>
  </g>
  <!-- token squares (a 4-bit weight matrix) -->
  <g fill="#8a8a84">
    <rect x="1080" y="760" width="22" height="22" rx="4" fill-opacity="0.10"/><rect x="1108" y="760" width="22" height="22" rx="4" fill-opacity="0.20"/>
    <rect x="1136" y="760" width="22" height="22" rx="4" fill-opacity="0.06"/><rect x="1164" y="760" width="22" height="22" rx="4" fill-opacity="0.16"/>
    <rect x="1080" y="788" width="22" height="22" rx="4" fill-opacity="0.18"/><rect x="1108" y="788" width="22" height="22" rx="4" fill-opacity="0.08"/>
    <rect x="1136" y="788" width="22" height="22" rx="4" fill-opacity="0.22"/><rect x="1164" y="788" width="22" height="22" rx="4" fill-opacity="0.10"/>
    <rect x="1080" y="816" width="22" height="22" rx="4" fill-opacity="0.07"/><rect x="1108" y="816" width="22" height="22" rx="4" fill-opacity="0.17"/>
    <rect x="1136" y="816" width="22" height="22" rx="4" fill-opacity="0.12"/><rect x="1164" y="816" width="22" height="22" rx="4" fill-opacity="0.21"/>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#8a8a84" fill-opacity="0.16">
  </g>

  <!-- Paimon: the sticker image (game/cover/paimon.png) is drawn over this glow by render.mjs -->
  <circle cx="1370" cy="540" r="360" fill="url(#glow)"/>
  <!-- speech bubble -->
  <g transform="translate(1600 210)">
    <path d="M0 0 h230 a30 30 0 0 1 30 30 v54 a30 30 0 0 1 -30 30 h-150 l-46 40 v-40 h-34 a30 30 0 0 1 -30 -30 v-54 a30 30 0 0 1 30 -30 z" fill="#ffffff" stroke="#d97757" stroke-width="4"/>
  </g>

  <!-- texts are drawn by render.mjs (TEXTS) -->
  <g font-family="'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif">
  </g>
  <!-- spec chips -->
  <g font-family="'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700">
    <rect x="140" y="790" width="290" height="70" rx="35" fill="#1f1f1d"/>
  </g>
</svg>
